# TokyoNight colour scheme for qt5ct / qt6ct, part of cosmic-tokyonight-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> TokyoNight, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#c0caf5, #24283b, #646a83, #4e5576, #1a1b26, #292e42, #c0caf5, #c4cff4, #c0caf5, #1a1b26, #1a1b26, #1a1b26, #7aa2f7, #1a1b26, #7aa2f7, #7aa2f7, #24283b, #1a1b26, #24283b, #c0caf5, #646a83
disabled_colors=#565f89, #24283b, #646a83, #4e5576, #1a1b26, #292e42, #565f89, #a9b1d6, #565f89, #1a1b26, #1a1b26, #1a1b26, #646a83, #a9b1d6, #646a83, #646a83, #24283b, #1a1b26, #24283b, #c0caf5, #646a83
inactive_colors=#c0caf5, #24283b, #646a83, #4e5576, #1a1b26, #292e42, #c0caf5, #c4cff4, #c0caf5, #1a1b26, #1a1b26, #1a1b26, #7aa2f7, #1a1b26, #7aa2f7, #7aa2f7, #24283b, #1a1b26, #24283b, #c0caf5, #646a83
