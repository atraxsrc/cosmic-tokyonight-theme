# TokyoNight for kitty, part of cosmic-tokyonight-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/TokyoNight.conf

foreground              #A9B1D6
background              #1A1B26
selection_foreground    none
selection_background    #4E5576

cursor                  #A9B1D6
cursor_text_color       #1A1B26

url_color               #E9BD64
url_style               curly

active_border_color     #7AA2F7
inactive_border_color   #646A83
bell_border_color       #E0AF68

active_tab_foreground   #1A1B26
active_tab_background   #7AA2F7
inactive_tab_foreground #A9B1D6
