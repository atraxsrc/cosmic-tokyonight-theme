# TokyoNight for lazygit, part of cosmic-tokyonight-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/tokyonight.yml and
# zsh/tokyonight.zsh sets LG_CONFIG_FILE to "config.yml,tokyonight.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/tokyonight.yml"
gui:
  theme:
    activeBorderColor:
      - "#7AA2F7"
      - bold
    inactiveBorderColor:
      - "#646A83"
    searchingActiveBorderColor:
      - "#E0AF68"
      - bold
    optionsTextColor:
      - "#A9B1D6"
    selectedLineBgColor:
      - "#414868"
    inactiveViewSelectedLineBgColor:
      - "#24283B"
    cherryPickedCommitFgColor:
      - "#1A1B26"
    cherryPickedCommitBgColor:
      - "#E9BD64"
    markedBaseCommitFgColor:
      - "#1A1B26"
    markedBaseCommitBgColor:
      - "#9ECE6A"
    unstagedChangesColor:
      - "#F7768E"
    defaultFgColor:
      - "#C0CAF5"
  authorColors:
    "*": "#E9BD64"
